<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#164e63">
    <link rel="manifest" href="./manifest.json">
    <title>トーインコントローラー</title>

    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            overscroll-behavior-y: none; 
            user-select: none; 
            -webkit-user-select: none;
            background-color: #164e63;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .card-time { font-size: 1.1rem; line-height: 1; letter-spacing: -0.05em; }
        .card-menu { font-size: 1rem; line-height: 1; }
        .card-pax { font-size: 0.9rem; line-height: 1; }
        .card-name { font-size: 0.8rem; line-height: 1.1; }
        @media (min-width: 640px) {
            .card-time { font-size: 1.5rem; }
            .card-menu { font-size: 1.25rem; }
            .card-pax { font-size: 1rem; }
            .card-name { font-size: 1rem; }
        }
        .is-dragging { opacity: 0.3; }
        
        /* ヘッダーD&D時のハイライト用 */
        .drag-target-highlight {
            position: relative;
        }
        .drag-target-highlight::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 3px solid #fbbf24; /* yellow-400 */
            background-color: rgba(255, 255, 255, 0.2);
            pointer-events: none;
        }
    </style>
</head>
<body class="h-[100dvh] w-screen overflow-hidden font-sans text-gray-800 flex flex-col bg-cyan-900">

    <header class="h-12 bg-cyan-800 flex items-center px-2 md:px-3 justify-between shadow-md z-20 flex-shrink-0">
        <button onclick="openMenu()" class="p-2 text-white active:bg-cyan-700 rounded-md">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <h1 class="text-white font-bold text-sm md:text-lg tracking-wider">トーインコントローラー <span class="text-xs text-cyan-300 font-normal">v1.6</span></h1>
        
        <div class="flex items-center gap-1">
            <button id="btn-install" class="hidden p-2 text-cyan-200 active:bg-cyan-700 rounded-md" title="アプリをインストール">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            </button>
            <button onclick="toggleFullScreen()" class="p-2 text-white active:bg-cyan-700 rounded-md" title="全画面表示">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
            </button>
        </div>
    </header>

    <div class="flex-1 flex w-full overflow-hidden" id="app-container">
        <!-- 列はJavaScriptで動的に生成されます -->
    </div>

    <div id="drag-ghost" class="fixed pointer-events-none z-50 bg-white rounded shadow-2xl border-2 border-cyan-400 opacity-95 hidden scale-105 rotate-2 overflow-hidden">
        <div id="ghost-content" class="p-1"></div>
    </div>

    <div id="menu-overlay" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-[60] hidden transition-opacity opacity-0">
        <div id="menu-drawer" class="w-4/5 max-w-sm h-full bg-slate-50 shadow-2xl transform -translate-x-full transition-transform duration-300 flex flex-col">
            <div class="bg-cyan-700 text-white p-4 flex justify-between items-center shadow-md">
                <h2 class="text-xl font-bold">設定</h2>
                <button onclick="closeMenu()" class="p-2 active:bg-cyan-800 rounded-full">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 space-y-6">
                <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
                    <h3 class="font-bold text-cyan-700 border-b border-cyan-100 pb-2 mb-3">基本設定</h3>
                    <div>
                        <label class="block text-sm font-bold text-slate-600 mb-1">スワイプ増減時間 (分)</label>
                        <div class="flex items-center gap-2">
                            <input type="number" id="setting-wait-time" inputmode="numeric" class="w-24 text-xl font-bold text-center bg-slate-100 border border-slate-300 rounded-lg py-2 focus:border-cyan-500 outline-none" />
                            <span class="text-slate-600 font-bold">分</span>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
                    <h3 class="font-bold text-cyan-700 border-b border-cyan-100 pb-2 mb-3">ボート＆船長設定</h3>
                    <div id="setting-columns" class="space-y-4"></div>
                </div>
            </div>

            <div class="p-4 bg-white border-t border-slate-200">
                <button onclick="saveSettings()" class="w-full py-3 bg-cyan-600 text-white text-lg font-black rounded-xl shadow active:bg-cyan-700 mb-4">
                    設定を保存
                </button>
            </div>
        </div>
    </div>

    <div id="modal-overlay" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-[70] hidden flex-col items-center justify-center p-2 sm:p-4">
        <div id="modal-content" class="bg-white rounded-3xl shadow-2xl w-full max-w-md max-h-[90vh] flex flex-col overflow-hidden transform transition-transform scale-95 duration-200">
            <div class="bg-cyan-600 px-5 py-3 flex justify-between items-center text-white flex-shrink-0">
                <h3 id="modal-title" class="text-xl font-black">新規予約</h3>
                <button onclick="closeModal()" class="p-2 rounded-full active:bg-cyan-700">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>

            <div class="p-4 sm:p-5 space-y-4 sm:space-y-5 overflow-y-auto flex-1">
                <div class="flex gap-3">
                    <div class="flex-1">
                        <label class="block text-sm font-bold text-slate-600 mb-1 flex items-center justify-between">
                            <span>予約時間</span>
                            <span class="text-xs font-normal text-cyan-600 flex items-center">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="mr-0.5"><polyline points="17 11 12 6 7 11"></polyline><polyline points="17 13 12 18 7 13"></polyline></svg>
                                5分刻み
                            </span>
                        </label>
                        <input type="time" id="input-time" class="w-full text-3xl sm:text-4xl font-black text-center bg-slate-100 border-2 border-slate-200 rounded-xl py-2 focus:border-cyan-500 outline-none" />
                    </div>
                    <div class="w-24 sm:w-28">
                        <label class="block text-sm font-bold text-slate-600 mb-1 flex items-center justify-between">
                            <span>人数</span>
                            <span class="text-xs font-normal text-cyan-600 flex items-center">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 11 12 6 7 11"></polyline><polyline points="17 13 12 18 7 13"></polyline></svg>
                            </span>
                        </label>
                        <div class="relative">
                            <input type="number" id="input-pax" min="1" inputmode="numeric" pattern="\d*" class="w-full text-3xl sm:text-4xl font-black text-center bg-slate-100 border-2 border-slate-200 rounded-xl py-2 pr-6 focus:border-cyan-500 outline-none" />
                            <span class="absolute right-2 top-1/2 -translate-y-1/2 text-sm font-bold text-slate-400">名</span>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-600 mb-1">メニュー</label>
                    <div class="flex gap-1.5 sm:gap-2" id="menu-buttons"></div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-600 mb-1">予約名</label>
                    <input type="text" id="input-name" placeholder="お名前 (省略可)" class="w-full text-xl sm:text-2xl font-bold bg-slate-100 border-2 border-slate-200 rounded-xl px-4 py-3 focus:border-cyan-500 outline-none" />
                </div>
            </div>

            <!-- フッター（保存 / 続けて） -->
            <div class="p-3 sm:p-4 bg-slate-50 border-t border-slate-200 flex gap-2 sm:gap-3 flex-shrink-0">
                <button id="btn-delete" onclick="deleteReservation()" class="hidden px-3 sm:px-4 py-3 bg-red-100 text-red-600 rounded-xl font-bold flex flex-col items-center justify-center active:bg-red-200">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>
                <button onclick="saveReservation()" class="flex-1 py-3 bg-cyan-600 text-white text-lg sm:text-xl font-black rounded-xl shadow-lg active:bg-cyan-700 active:scale-95 transition-transform">
                    保存する
                </button>
                <button id="btn-continue" onclick="continueReservation()" class="hidden flex-1 py-3 bg-teal-500 text-white text-lg sm:text-xl font-black rounded-xl shadow-lg active:bg-teal-600 active:scale-95 transition-transform whitespace-nowrap">
                    続けて
                </button>
            </div>
        </div>
    </div>

    <script>
        const MENU_OPTIONS = ['D', 'M', 'U', 'J', 'X'];
        
        let state = {
            settings: { defaultWaitTime: 15 },
            columns: [
                { id: "col-1", jetName: "旧白黒", staffName: "スタッフ1", reservations: [] },
                { id: "col-2", jetName: "新白黒", staffName: "スタッフ2", reservations: [] },
                { id: "col-3", jetName: "水色", staffName: "スタッフ3", reservations: [] },
                { id: "col-4", jetName: "白", staffName: "スタッフ4", reservations: [] }
            ],
            drag: {
                isDragging: false, itemId: null, sourceColId: null,
                offsetX: 0, offsetY: 0, width: 0, ghostEl: null, targetColEl: null
            },
            modal: {
                mode: 'add', targetColId: null, targetItemId: null,
                formData: { time: "09:00", menu: "D", pax: 2, name: "" }
            }
        };

        function loadState() {
            const saved = localStorage.getItem('towInAppState_v16');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed.settings) state.settings = parsed.settings;
                    if (parsed.columns) state.columns = parsed.columns;
                } catch (e) {}
            }
        }

        function saveStateToStorage() {
            localStorage.setItem('towInAppState_v16', JSON.stringify({
                settings: state.settings,
                columns: state.columns
            }));
        }

        const generateId = () => Math.random().toString(36).substr(2, 9);
        const formatTime = (timeStr) => timeStr.replace(':', '');
        const sortReservations = (a, b) => a.time.localeCompare(b.time);

        // 現在時刻から一番近い5分刻みの時刻を取得
        const getCurrentRoundedTime = () => {
            const now = new Date();
            let h = now.getHours();
            let m = now.getMinutes();
            const remainder = m % 5;
            
            if (remainder !== 0) {
                m += (5 - remainder); // 切り上げ
            }
            
            if (m >= 60) { m -= 60; h += 1; }
            if (h >= 24) h -= 24;
            
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        };

        const getMenuColorClasses = (menu) => {
            switch(menu) {
                case 'D': return 'bg-yellow-400 text-yellow-950';
                case 'M': return 'bg-red-500 text-white';
                case 'U': return 'bg-blue-500 text-white';
                case 'J': return 'bg-green-500 text-white'; // Jは緑に変更
                case 'X': return 'bg-black text-white';     // Xは黒に変更
                default: return 'bg-cyan-100 text-cyan-700';
            }
        };

        const appContainer = document.getElementById('app-container');

        function initLayout() {
            appContainer.innerHTML = '';
            state.columns.forEach((col) => {
                const colEl = document.createElement('div');
                colEl.className = "flex-1 flex flex-col bg-sky-50 border-r-2 border-cyan-800 last:border-r-0 overflow-hidden";
                colEl.dataset.colId = col.id;
                
                // スタッフ名を上（大）、船名を下（小）に配置し、個別にドラッグ可能にする
                colEl.innerHTML = `
                    <div class="bg-white z-10 sticky top-0 shadow-sm flex flex-col">
                        <div class="bg-cyan-600 text-white text-center py-2 cursor-grab active:cursor-grabbing header-drag-item transition-colors" draggable="true" data-drag-type="staff" data-col-id="${col.id}">
                            <h2 class="text-base sm:text-xl md:text-2xl font-black tracking-widest truncate px-1 pointer-events-none">${col.staffName}</h2>
                        </div>
                        <div class="bg-cyan-500 text-cyan-50 text-center py-1 border-b-2 border-cyan-800 cursor-grab active:cursor-grabbing header-drag-item transition-colors" draggable="true" data-drag-type="jet" data-col-id="${col.id}">
                            <span class="text-xs sm:text-sm md:text-base font-bold truncate block px-1 pointer-events-none">${col.jetName}</span>
                        </div>
                    </div>
                    <div id="list-${col.id}" class="flex-1 overflow-y-auto p-1.5 md:p-2 space-y-2 hide-scrollbar pb-[75vh] flex flex-col">
                    </div>
                `;
                appContainer.appendChild(colEl);
            });
            renderAllReservations();
            initHeaderDragAndDrop();
        }

        // ヘッダー要素（スタッフ名 / 船名）の独立入れ替え
        function initHeaderDragAndDrop() {
            let draggedType = null;
            let draggedColId = null;

            const items = document.querySelectorAll('.header-drag-item');
            
            items.forEach(item => {
                item.addEventListener('dragstart', (e) => {
                    draggedType = item.dataset.dragType;
                    draggedColId = item.dataset.colId;
                    e.dataTransfer.effectAllowed = 'move';
                    item.classList.add('opacity-50');
                });
                
                item.addEventListener('dragend', (e) => {
                    item.classList.remove('opacity-50');
                    items.forEach(el => el.classList.remove('drag-target-highlight'));
                });

                item.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    // 同じタイプ（スタッフ同士、船同士）のみドロップ許可
                    if (item.dataset.dragType === draggedType && item.dataset.colId !== draggedColId) {
                        e.dataTransfer.dropEffect = 'move';
                        item.classList.add('drag-target-highlight');
                    }
                });

                item.addEventListener('dragleave', (e) => {
                    item.classList.remove('drag-target-highlight');
                });

                item.addEventListener('drop', (e) => {
                    e.preventDefault();
                    item.classList.remove('drag-target-highlight');
                    
                    const targetType = item.dataset.dragType;
                    const targetColId = item.dataset.colId;
                    
                    if (draggedType === targetType && draggedColId && targetColId && draggedColId !== targetColId) {
                        const sourceCol = state.columns.find(c => c.id === draggedColId);
                        const targetCol = state.columns.find(c => c.id === targetColId);
                        
                        // 内容をスワップ（入れ替え）
                        if (draggedType === 'staff') {
                            const temp = sourceCol.staffName;
                            sourceCol.staffName = targetCol.staffName;
                            targetCol.staffName = temp;
                        } else if (draggedType === 'jet') {
                            const temp = sourceCol.jetName;
                            sourceCol.jetName = targetCol.jetName;
                            targetCol.jetName = temp;
                        }
                        
                        saveStateToStorage();
                        initLayout(); // 再描画
                    }
                });
            });
        }

        function renderAllReservations() {
            state.columns.forEach(col => {
                const listEl = document.getElementById(`list-${col.id}`);
                if (!listEl) return;
                
                listEl.innerHTML = ''; 

                col.reservations.forEach(res => {
                    const card = document.createElement('div');
                    card.className = "res-card bg-white rounded-lg shadow-md border-2 border-slate-200 overflow-hidden cursor-pointer select-none active:bg-slate-50 transition-colors flex-shrink-0";
                    card.style.touchAction = "pan-y";
                    card.dataset.itemId = res.id;
                    card.dataset.colId = col.id;
                    card.dataset.resData = JSON.stringify(res); 

                    card.innerHTML = `
                        <div class="p-2 pointer-events-none flex flex-col justify-between">
                            <div class="flex justify-between items-center border-b-2 border-dashed border-slate-200 pb-1 mb-1">
                                <span class="card-time font-black text-slate-800">${formatTime(res.time)}</span>
                                <span class="card-menu font-black px-2 py-0.5 rounded leading-none flex items-center justify-center ${getMenuColorClasses(res.menu)}">${res.menu}</span>
                            </div>
                            <div class="flex items-start mt-0.5 gap-2 w-full overflow-hidden">
                                <div class="flex items-baseline flex-shrink-0">
                                    <span class="card-pax font-black text-slate-900">${res.pax}</span>
                                    <span class="text-xs text-slate-500 ml-0.5 font-bold">名</span>
                                </div>
                                <div class="card-name font-bold text-slate-700 leading-tight w-full break-all whitespace-normal text-right">
                                    ${res.name || "-"}
                                </div>
                            </div>
                        </div>
                    `;
                    listEl.appendChild(card);
                });

                const addBtn = document.createElement('button');
                addBtn.className = "mt-3 w-full py-4 border-4 border-dashed border-cyan-300 rounded-xl text-cyan-600 font-black text-base md:text-lg flex justify-center items-center active:bg-cyan-100 flex-shrink-0 bg-white/50";
                addBtn.innerHTML = `＋ 追加`;
                addBtn.onclick = () => openModal('add', col.id);
                listEl.appendChild(addBtn);
            });
        }

        let touchTimer = null;
        const dragGhost = document.getElementById('drag-ghost');
        const ghostContent = document.getElementById('ghost-content');
        const LONG_PRESS_DURATION = 250;

        document.addEventListener('pointerdown', (e) => {
            if (e.button !== 0 && e.pointerType === 'mouse') return;
            const card = e.target.closest('.res-card');
            if (!card) return;

            const colId = card.dataset.colId;
            const itemId = card.dataset.itemId;
            const resData = JSON.parse(card.dataset.resData);
            const rect = card.getBoundingClientRect();

            state.drag = {
                isDragging: false, isActive: false, 
                startX: e.clientX, startY: e.clientY,
                itemId: itemId, sourceColId: colId, resData: resData,
                offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top,
                width: rect.width, originalCard: card, targetColEl: null
            };

            touchTimer = setTimeout(() => {
                state.drag.isActive = true;
                state.drag.isDragging = true;
                if (navigator.vibrate) navigator.vibrate(40);

                ghostContent.innerHTML = card.innerHTML; 
                dragGhost.style.width = `${state.drag.width}px`;
                dragGhost.style.left = `${e.clientX - state.drag.offsetX}px`;
                dragGhost.style.top = `${e.clientY - state.drag.offsetY}px`;
                
                dragGhost.classList.remove('hidden');
                card.classList.add('is-dragging');
                document.body.style.overflow = 'hidden';
            }, LONG_PRESS_DURATION);
        });

        document.addEventListener('pointermove', (e) => {
            if (!state.drag.originalCard) return;

            if (!state.drag.isActive) {
                const dx = Math.abs(e.clientX - state.drag.startX);
                const dy = Math.abs(e.clientY - state.drag.startY);
                if (dx > 10 || dy > 10) {
                    clearTimeout(touchTimer);
                    state.drag.originalCard = null; 
                }
                return;
            }

            if (state.drag.isDragging) {
                e.preventDefault(); 
                dragGhost.style.left = `${e.clientX - state.drag.offsetX}px`;
                dragGhost.style.top = `${e.clientY - state.drag.offsetY}px`;

                const elements = document.elementsFromPoint(e.clientX, e.clientY);
                let foundCol = elements.find(el => el.dataset && el.dataset.colId && el.classList.contains('flex-1'));
                
                if (state.drag.targetColEl && state.drag.targetColEl !== foundCol) {
                    state.drag.targetColEl.classList.remove('bg-cyan-100');
                }
                if (foundCol) {
                    foundCol.classList.add('bg-cyan-100');
                    state.drag.targetColEl = foundCol;
                }
            }
        }, { passive: false });

        const resetDrag = () => {
            clearTimeout(touchTimer);
            if(dragGhost) dragGhost.classList.add('hidden');
            if (state.drag.originalCard) state.drag.originalCard.classList.remove('is-dragging');
            if (state.drag.targetColEl) state.drag.targetColEl.classList.remove('bg-cyan-100');
            
            state.drag.isDragging = false;
            state.drag.isActive = false;
            state.drag.originalCard = null;
            document.body.style.overflow = '';
        };

        document.addEventListener('pointerup', (e) => {
            clearTimeout(touchTimer);
            
            if (!state.drag.isActive && state.drag.originalCard) {
                const card = state.drag.originalCard;
                const colId = card.dataset.colId;
                const resData = JSON.parse(card.dataset.resData);
                resetDrag(); 
                openModal('edit', colId, resData);
                return;
            }

            if (state.drag.isDragging) {
                const { sourceColId, itemId, targetColEl } = state.drag;
                const targetColId = targetColEl ? targetColEl.dataset.colId : sourceColId;

                if (targetColId && targetColId !== sourceColId) {
                    let itemToMove = null;
                    const sourceCol = state.columns.find(c => c.id === sourceColId);
                    sourceCol.reservations = sourceCol.reservations.filter(r => {
                        if(r.id === itemId) { itemToMove = r; return false; }
                        return true;
                    });

                    if (itemToMove) {
                        const targetCol = state.columns.find(c => c.id === targetColId);
                        targetCol.reservations.push(itemToMove);
                        targetCol.reservations.sort(sortReservations);
                        saveStateToStorage();
                    }
                }
                resetDrag();
                renderAllReservations();
            } else {
                resetDrag();
            }
        });

        document.addEventListener('pointercancel', resetDrag);

        const menuOverlay = document.getElementById('menu-overlay');
        const menuDrawer = document.getElementById('menu-drawer');
        const settingWaitTime = document.getElementById('setting-wait-time');
        const settingColumns = document.getElementById('setting-columns');

        function openMenu() {
            settingWaitTime.value = state.settings.defaultWaitTime;
            settingColumns.innerHTML = '';
            state.columns.forEach((col, index) => {
                settingColumns.innerHTML += `
                    <div class="bg-slate-50 p-2 rounded border border-slate-200">
                        <div class="text-xs font-bold text-slate-500 mb-1">列 ${index + 1}</div>
                        <div class="flex gap-2 mb-2">
                            <input type="text" id="set-staff-${col.id}" value="${col.staffName}" placeholder="スタッフ名" class="flex-1 w-full text-sm font-bold bg-white border border-slate-300 rounded p-2 outline-none focus:border-cyan-500">
                        </div>
                        <div class="flex gap-2">
                            <input type="text" id="set-jet-${col.id}" value="${col.jetName}" placeholder="船体名" class="flex-1 w-full text-sm font-bold bg-white border border-slate-300 rounded p-2 outline-none focus:border-cyan-500">
                        </div>
                    </div>
                `;
            });

            menuOverlay.classList.remove('hidden');
            setTimeout(() => {
                menuOverlay.classList.remove('opacity-0');
                menuDrawer.classList.remove('-translate-x-full');
            }, 10);
        }

        function closeMenu() {
            menuOverlay.classList.add('opacity-0');
            menuDrawer.classList.add('-translate-x-full');
            setTimeout(() => { menuOverlay.classList.add('hidden'); }, 300);
        }

        function saveSettings() {
            state.settings.defaultWaitTime = parseInt(settingWaitTime.value) || 15;
            state.columns.forEach(col => {
                const jetInput = document.getElementById(`set-jet-${col.id}`);
                const staffInput = document.getElementById(`set-staff-${col.id}`);
                if (jetInput) col.jetName = jetInput.value || `MJ-${col.id.replace('col-','')}`;
                if (staffInput) col.staffName = staffInput.value || `スタッフ`;
            });
            saveStateToStorage();
            initLayout();
            closeMenu();
        }

        const modalOverlay = document.getElementById('modal-overlay');
        const modalContent = document.getElementById('modal-content');
        const titleEl = document.getElementById('modal-title');
        const timeInput = document.getElementById('input-time');
        const paxInput = document.getElementById('input-pax');
        const nameInput = document.getElementById('input-name');
        const btnDelete = document.getElementById('btn-delete');
        const btnContinue = document.getElementById('btn-continue');
        const menuContainer = document.getElementById('menu-buttons');

        function renderMenuButtons() {
            menuContainer.innerHTML = '';
            MENU_OPTIONS.forEach(m => {
                const btn = document.createElement('button');
                const isSelected = state.modal.formData.menu === m;
                const colorClass = getMenuColorClasses(m);
                
                btn.className = `flex-1 py-3 text-xl sm:text-2xl font-black rounded-xl border-4 transition-colors ${
                    isSelected ? `${colorClass} border-cyan-300 shadow-md transform scale-105` : 'bg-white border-slate-200 text-slate-400'
                }`;
                btn.innerText = m;
                btn.onclick = () => {
                    state.modal.formData.menu = m;
                    renderMenuButtons();
                };
                menuContainer.appendChild(btn);
            });
        }

        function openModal(mode, colId, resData = null) {
            state.modal.mode = mode;
            state.modal.targetColId = colId;
            
            if (mode === 'add') {
                // 新規予約時は現在時刻から近い5分間隔、人数は2名
                state.modal.formData = { time: getCurrentRoundedTime(), menu: "D", pax: 2, name: "" };
                titleEl.innerText = '新規予約';
                btnDelete.classList.add('hidden');
                btnContinue.classList.remove('hidden'); // 続けてボタンを表示
            } else {
                state.modal.targetItemId = resData.id;
                state.modal.formData = { ...resData };
                titleEl.innerText = '予約の変更';
                btnDelete.classList.remove('hidden');
                btnContinue.classList.add('hidden'); // 続けてボタンを隠す
            }

            timeInput.value = state.modal.formData.time;
            paxInput.value = state.modal.formData.pax;
            nameInput.value = state.modal.formData.name;
            renderMenuButtons();

            modalOverlay.classList.remove('hidden');
            modalOverlay.classList.add('flex');
            setTimeout(() => { modalContent.classList.remove('scale-95'); }, 10);
        }

        function closeModal() {
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modalOverlay.classList.add('hidden');
                modalOverlay.classList.remove('flex');
            }, 200);
        }

        // 実際のデータ保存処理
        function executeSave() {
            const newRes = {
                id: state.modal.mode === 'add' ? generateId() : state.modal.targetItemId,
                time: timeInput.value || "00:00",
                menu: state.modal.formData.menu,
                pax: parseInt(paxInput.value) || 2, // 未入力時は2
                name: nameInput.value
            };

            const col = state.columns.find(c => c.id === state.modal.targetColId);
            
            if (state.modal.mode === 'add') {
                col.reservations.push(newRes);
            } else {
                const idx = col.reservations.findIndex(r => r.id === newRes.id);
                if (idx !== -1) col.reservations[idx] = newRes;
            }

            col.reservations.sort(sortReservations);
            saveStateToStorage();
            renderAllReservations();
        }

        function saveReservation() {
            executeSave();
            closeModal();
        }

        // 「続けて」ボタンの処理：保存して15分進める
        function continueReservation() {
            executeSave(); // まず現在の状態を保存
            
            // 時間を15分進める
            let [h, m] = state.modal.formData.time.split(":").map(Number);
            m += 15;
            while (m >= 60) { m -= 60; h += 1; }
            if (h >= 24) h -= 24;
            
            const newTime = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
            state.modal.formData.time = newTime;
            timeInput.value = newTime;
            
            // 人数や名前、メニューはそのまま。
            // idは executeSave 内で add モードのため毎回新規生成されるので問題なし
            
            if (navigator.vibrate) navigator.vibrate([30, 50, 30]); // 成功フィードバック
        }

        function deleteReservation() {
            const col = state.columns.find(c => c.id === state.modal.targetColId);
            col.reservations = col.reservations.filter(r => r.id !== state.modal.targetItemId);
            saveStateToStorage();
            closeModal();
            renderAllReservations();
        }

        let swipeControl = { active: false, type: null, startY: 0, currentY: 0, isSwiping: false };

        function initSwipeControls() {
            const timeEl = document.getElementById('input-time');
            const paxEl = document.getElementById('input-pax');

            const handleStart = (e, type) => {
                swipeControl.active = true;
                swipeControl.type = type;
                swipeControl.isSwiping = false;
                swipeControl.startY = e.touches ? e.touches[0].clientY : e.clientY;
                swipeControl.currentY = swipeControl.startY;
            };

            const handleMove = (e) => {
                if (!swipeControl.active) return;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const deltaY = swipeControl.currentY - clientY; 

                if (!swipeControl.isSwiping && Math.abs(swipeControl.startY - clientY) > 10) {
                    swipeControl.isSwiping = true;
                }

                if (swipeControl.isSwiping) {
                    if (e.cancelable) e.preventDefault();
                    if (Math.abs(deltaY) > 25) { 
                        updateSwipeValue(swipeControl.type, deltaY > 0 ? 1 : -1);
                        swipeControl.currentY = clientY; 
                    }
                }
            };

            const handleEnd = () => { swipeControl.active = false; };
            const preventClickIfSwiping = (e) => {
                if (swipeControl.isSwiping) { e.preventDefault(); e.stopPropagation(); swipeControl.isSwiping = false; }
            };

            const elements = [{ el: timeEl, type: 'time' }, { el: paxEl, type: 'pax' }];
            elements.forEach(({el, type}) => {
                el.addEventListener('touchstart', e => handleStart(e, type), {passive: true});
                el.addEventListener('touchmove', handleMove, {passive: false});
                el.addEventListener('touchend', handleEnd);
                el.addEventListener('click', preventClickIfSwiping);
                
                el.addEventListener('mousedown', e => handleStart(e, type));
                el.addEventListener('mousemove', e => { if (e.buttons === 1) handleMove(e); });
                window.addEventListener('mouseup', handleEnd);
            });
        }

        function updateSwipeValue(type, direction) {
            if (type === 'time') {
                const stepMin = 5; // 常に5分刻み
                let [h, m] = timeInput.value.split(":").map(Number);
                m += direction * stepMin;
                while (m >= 60) { m -= 60; h += 1; }
                while (m < 0) { m += 60; h -= 1; }
                if (h >= 24) h -= 24;
                if (h < 0) h += 24;
                timeInput.value = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
                state.modal.formData.time = timeInput.value;
            } else if (type === 'pax') {
                let val = parseInt(paxInput.value) || 1;
                val += direction;
                if (val < 1) val = 1;
                paxInput.value = val;
                state.modal.formData.pax = val;
            }
            if (navigator.vibrate) navigator.vibrate(10);
        }

        // 起動処理
        loadState();
        initLayout();
        initSwipeControls();

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
                else if (document.documentElement.webkitRequestFullscreen) document.documentElement.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }
    </script>
</body>
</html>
